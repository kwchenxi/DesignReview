<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Review — 设计还原度检查</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Floating pill header -->
  <header class="page-header">
    <div class="container">
      <div class="logo-mark">DR</div>
      <div class="logo-text">Design<span>Review</span><span class="logo-sub">/ 还原度检查</span></div>
    </div>
  </header>

  <div class="main-content">

    <!-- Hero headline -->
    <div class="hero-headline">
      <p>上传线上页面截图与设计稿截图，AI 或算法自动对比还原度，输出结构化检查报告。</p>
    </div>

    <!-- Mode segment -->
    <div class="mode-segment">
      <button type="button" class="mode-option active" data-mode="ai" onclick="switchMode('ai')">
        <span class="mode-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 0 0-2.455 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" /></svg>
        </span>
        <span>AI 分析</span>
        <span class="mode-tag">Token</span>
      </button>
      <button type="button" class="mode-option" data-mode="algorithm" onclick="switchMode('algorithm')">
        <span class="mode-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" /></svg>
        </span>
        <span>算法分析</span>
        <span class="mode-tag">Free</span>
      </button>
    </div>

    <!-- AI settings panel -->
    <div class="ai-settings" id="aiSettings">
      <div class="ai-settings-title" onclick="toggleAISettings()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
        AI 分析配置
        <span class="ai-status" id="aiStatus"><span class="ai-status-dot"></span><span id="aiStatusText">检测中...</span></span>
        <span id="aiToggleArrow" style="margin-left:auto;">▶</span>
      </div>
      <div id="aiFieldsBody">
        <div class="ai-field">
          <label>API Key</label>
          <input type="password" id="aiApiKey" placeholder="sk-..." />
          <div class="hint">支持 OpenAI、DeepSeek、Claude 等</div>
        </div>
        <div class="ai-field">
          <label>API Base URL</label>
          <input type="text" id="aiApiBase" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1" />
          <div class="hint">OpenAI: https://api.openai.com/v1 | Claude: https://api.anthropic.com</div>
        </div>
        <div class="ai-field">
          <label>Model</label>
          <select id="aiModel">
            <option value="claude-sonnet-4-20250514" selected>Claude Sonnet 4</option>
            <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o Mini</option>
          </select>
        </div>
      </div>
    </div>

    <form id="compareForm" enctype="multipart/form-data">
      <!-- Upload grid — Double-Bezel cards -->
      <div class="upload-grid">
        <div class="upload-card" id="pageCard">
          <div class="upload-card-inner">
            <div class="upload-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5a-17.92 17.92 0 0 1-8.716-2.247m0 0A8.966 8.966 0 0 1 3 12c0-1.264.26-2.466.733-3.558" /></svg>
            </div>
            <h3>线上页面</h3>
            <p>上传页面截图</p>
            <input type="file" id="pageFile" name="pageScreenshot" accept="image/*" />
            <button type="button" class="btn-select" onclick="document.getElementById('pageFile').click()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
              选择截图
            </button>
            <div class="file-name" id="pageFileName"></div>
            <img class="preview-img" id="pagePreview" />
          </div>
        </div>

        <div class="upload-card" id="figmaCard">
          <div class="upload-card-inner">
            <div class="upload-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42" /></svg>
            </div>
            <h3>设计稿</h3>
            <p>上传 Figma 设计稿截图</p>
            <input type="file" id="figmaFile" name="figmaScreenshot" accept="image/*" />
            <button type="button" class="btn-select" onclick="document.getElementById('figmaFile').click()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
              选择截图
            </button>
            <div class="file-name" id="figmaFileName"></div>
            <img class="preview-img" id="figmaPreview" />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" /></svg>
        开始检查
      </button>
    </form>

    <!-- Skeleton loading -->
    <div class="loading" id="loading">
      <div class="skeleton-card">
        <div class="skeleton-circle"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-line"></div>
      </div>
      <p id="loadingText">正在对比分析中...</p>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
      <span id="errorText"></span>
    </div>

    <!-- Results -->
    <div class="result-section" id="resultSection">
      <div class="result-header">
        <div class="score-wrapper" id="scoreWrapper">
          <div class="score-inner">
            <div class="score-big" id="resultScore">--</div>
          </div>
        </div>
        <div class="result-meta">
          <h2>还原度评分</h2>
          <p id="resultSummary"></p>
        </div>
      </div>
      <div class="stats-row" id="resultStats"></div>
      <div class="result-actions">
        <button type="button" class="open-report-btn" id="reportBtn" onclick="showReport()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg>
          查看完整报告
        </button>
        <button type="button" class="btn-reset" onclick="resetForm()">重新检查</button>
      </div>
    </div>

    <!-- Report iframe -->
    <div class="report-frame-container" id="reportFrameContainer" style="display:none;">
      <div class="report-frame-header">
        <h3>检查报告</h3>
        <button type="button" class="btn-close-report" onclick="closeReport()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
          关闭
        </button>
      </div>
      <iframe id="reportFrame" class="report-frame"></iframe>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
